<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Submitted</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>Review Submitted</h1>
    </header>

    <main>
        <p>Thank you! Your review has been successfully submitted.</p>

        <p>You have submitted <strong id="counter">0</strong> reviews so far.</p>

        <a href="form.html">Submit Another Review</a>
    </main>

    <footer>
        <p>&copy; 2025 · WDD 131 Assignment</p>
    </footer>

    <script>
        // Get count
        let count = Number(localStorage.getItem("reviewCount")) || 0;

        // Increase by 1 on page load
        count++;
        localStorage.setItem("reviewCount", count);

        // Display it
        document.getElementById("counter").textContent = count;
    </script>

</body>

</html>
