<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="A responsive picture album showcasing beautiful temples with captions, designed using modern HTML, CSS, and JavaScript.">
        <meta name='author' content='Joshua Tuks'>
        <title>Temple Album</title>
        <link rel="stylesheet" href="styles/temples.css">
        <link rel="stylesheet" href="styles/temples-large.css" media="(min-width: 700px)">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

        <script src="scripts/temples.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Temple Album</h1>
            <button id="menuButton" aria-label="Toggle menu">☰</button>
            <nav id="navMenu">
                <a href="#">Home</a>
                <a href="#">Old</a>
                <a href="#">New</a>
                <a href="#">Large</a>
                <a href="#">Small</a>
            </nav>
        </header>

        <main>
            <h2>Temples Around the World</h2>
            <section class="temple-grid">
            <!-- You can duplicate these -->
            <figure>
                <img src="https://placehold.co/400x250" alt="Temple 1">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>
            <figure>
                <img src="https://placehold.co/400x250" alt="Temple 2">
                <figcaption>Rome Italy Temple</figcaption>
            </figure>
            <figure>
                <img src="https://placehold.co/400x250" alt="Temple 3">
                <figcaption>Accra Ghana Temple</figcaption>
            </figure>
            <figure>
                <img src="https://placehold.co/400x250" alt="Temple 4">
                <figcaption>Tokyo Japan Temple</figcaption>
            </figure>
            <figure>
                <img src="https://placehold.co/400x250" alt="Temple 5">
                <figcaption>Johannesburg Temple</figcaption>
            </figure>
            <figure>
                <img src="https://placehold.co/400x250" alt="Temple 6">
                <figcaption>São Paulo Temple</figcaption>
            </figure>
            <figure>
                <img src="https://placehold.co/400x250" alt="Temple 7">
                <figcaption>Manila Philippines Temple</figcaption>
            </figure>
            <figure>
                <img src="https://placehold.co/400x250" alt="Temple 8">
                <figcaption>Paris France Temple</figcaption>
            </figure>
            <figure>
                <img src="https://placehold.co/400x250" alt="Temple 9">
                <figcaption>Lima Peru Temple</figcaption>
            </figure>
            </section>
        </main>

        <footer>
            <p>&copy; <span id="currentYear"></span> | Joshua Obodo <b>(Kuma Dev)</b> | WDD 131</p>
            <p>Last modified: <span id="lastModified"></span></p>
        </footer>
    </body>
</html>
