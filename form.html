<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Review Form</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" id="reviewForm">
            <!-- Product Name -->
            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option disabled selected>Select a Product ...</option>
            </select>

            <!-- Rating -->
            <fieldset>
                <legend>Overall Rating</legend>
                <label><input type="radio" name="rating" value="1" required> ☆</label>
                <label><input type="radio" name="rating" value="2" required> ☆☆</label>
                <label><input type="radio" name="rating" value="3" required> ☆☆☆</label>
                <label><input type="radio" name="rating" value="4" required> ☆☆☆☆</label>
                <label><input type="radio" name="rating" value="5" required> ☆☆☆☆☆</label>
            </fieldset>

            <!-- Date Installed -->
            <label for="installed">Date of Installation</label>
            <input type="date" id="installed" name="installed" required />

            <!-- Features -->
            <fieldset>
                <legend>Useful Features</legend>
                <label><input type="checkbox" name="features" value="fast"> Fast Performance</label>
                <label><input type="checkbox" name="features" value="durable"> Durable</label>
                <label><input type="checkbox" name="features" value="compact"> Compact</label>
                <label><input type="checkbox" name="features" value="easy"> Easy to Use</label>
            </fieldset>

            <!-- Written Review -->
            <label for="review">Written Review</label>
            <textarea id="review" name="review" rows="4" placeholder="Write your thoughts…"></textarea>

            <!-- User Name -->
            <label for="username">Your Name</label>
            <input type="text" id="username" name="username" />

            <!-- Submit -->
            <input type="submit" value="Submit Review" />
        </form>
    </main>

    <footer>
        <p>&copy; 2025 · WDD 131 Assignment</p>
    </footer>
    <script src="js/form.js"></script>
</body>

</html>
